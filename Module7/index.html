<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
      <form action="">

        <fieldset>
          <legend>Personal Information</legend>
         <label for="firstname"> FirstName: </label> <br>
         <input type="text" id="firstname" name="firstname" value="John" readonly > <br>

         <label for="lastname"> LastName: </label> <br>
         <input type="text" id="lastname" name="lastname" > <br>

         <label for="email">Email:</label><br>
         <input type="email" id="email" name="email" size="40" required><br>

         <label for="password">Password:</label><br>
         <input type="password" id="password" name="password" placeholder="Password"><br>

         <label for="gender">Gender:</label><br>

         <input type="radio" id="male" name="gender" value="male">
         <label for="male">Male</label><br>
         <input type="radio" id="female" name="gender" value="female">
         <label for="female">Female</label><br><br>

         <label for="hobbies">Hobbies:</label><br>
         <input type="checkbox" id="gaming" name="gaming" value="gaming">
         <label for="gameing">Gaming</label><br>
     
         <input type="checkbox" id="football" name="football" value="football">
         <label for="football">Football</label><br>
         
         <input type="checkbox" id="swimming" name="swimming" value="swimming">
         <label for="swimming">Swimming</label><br><br>

         <label for="pet">Choose a pet:</label>
        <select name="pet" id="pet">
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Parrot">Parrot</option>
        </select> <br><br>
       
       
        <textarea name="message" id="message" rows="10" cols="20" maxlength="50"> </textarea><br>

        <input type="submit" name="submit" id="submit">

       </fieldset>

      </form>




</body>
</html>
